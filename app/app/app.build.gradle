apply plugin: 'com.android.application'

android {
    namespace 'com.cesia.planfumigacion'
    compileSdk 36

    defaultConfig {
        applicationId 'com.cesia.planfumigacion'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
